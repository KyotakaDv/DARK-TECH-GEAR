<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DARKGEAR · Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="logo">✦</span><span>DARK<b>GEAR</b><small>PAINEL ADMIN</small></span></a>
    <nav><a href="/">← Voltar à loja</a><button id="logout" class="btn ghost sm" hidden>Sair</button></nav>
  </header>

  <main>
    <section id="login" class="login">
      <h2>Acesso administrativo</h2>
      <p class="muted">Informe o ADMIN_TOKEN definido no arquivo .env do servidor.</p>
      <form id="loginForm" class="stack">
        <input id="token" type="password" placeholder="ADMIN_TOKEN" required>
        <button class="btn primary">Entrar</button>
      </form>
      <p id="loginMsg" class="msg"></p>
    </section>

    <section id="panel" hidden>
      <div id="stats" class="stats"></div>
      <div class="tabs">
        <div class="seg">
          <button class="tab active" data-tab="products">Catálogo</button>
          <button class="tab" data-tab="orders">Pedidos</button>
        </div>
        <button id="newProduct" class="btn primary sm">+ Novo produto</button>
      </div>
      <div class="table-wrap"><table id="table"></table></div>
    </section>
  </main>

  <dialog id="prodDlg" class="modal">
    <header><h3 id="prodTitle"></h3><button class="close" data-close>✕</button></header>
    <form id="prodForm" class="form">
      <input type="hidden" name="pid">
      <label class="span2">Nome<input name="name" required></label>
      <label>Categoria<select name="category"><option>Hardware</option><option>Wearables</option><option>Áudio</option><option>Acessórios</option></select></label>
      <label>Badge<input name="badge" placeholder="Novo / Promoção"></label>
      <label>Preço (R$)<input name="price" type="number" step="0.01" min="0" required></label>
      <label>Preço original (R$)<input name="originalPrice" type="number" step="0.01" min="0"></label>
      <label>Estoque<input name="stockCount" type="number" min="0" required></label>
      <label class="span2">URL da imagem<input name="image" type="url"></label>
      <label class="span2">Variantes (separe por vírgula)<input name="variants"></label>
      <label class="span2">Tamanhos (separe por vírgula)<input name="sizes"></label>
      <label class="span2">Descrição<textarea name="description" rows="3"></textarea></label>
      <p id="prodMsg" class="msg span2"></p>
      <div class="actions span2"><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn primary">Salvar</button></div>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>
  <script src="admin.js"></script>
</body>
</html>
